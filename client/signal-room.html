<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Handset</title>
<!--
  HANDSET — clean signing-first shell (v2). Aarya owns the visual layer.
  Camera-dominant, captions as a clean overlay band. Figtree everywhere; mono
  ONLY on the latency number. No decorative chrome — every element earns its place.
  Recognition (Arav) plugs into SignalRoom.* hooks. See design-system/MASTER.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#0B0D11; --raise:#14171F;
    --signal:#34E5B0;   /* YOU */
    --hearing:#F5B23D;  /* THEM */
    --text:#F2F5F8; --dim:#9AA3B2; --faint:#5A6372;
    --font:'Figtree',system-ui,-apple-system,sans-serif;
    --font-num:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--base); color:var(--text); font-family:var(--font);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .app{position:relative; height:100vh; height:100dvh; display:flex; flex-direction:column}

  /* ── slim top bar: identity + call status ONLY (no fake HUD) ── */
  .bar{
    display:flex; align-items:center; gap:14px; padding:18px 26px; z-index:5;
    position:absolute; top:0; left:0; right:0;
    background:linear-gradient(var(--base),rgba(11,13,17,0));
  }
  .logo{font-weight:700; font-size:16px; letter-spacing:-.01em}
  .logo b{color:var(--signal)}
  .status{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); font-weight:500}
  .status .pip{width:8px;height:8px;border-radius:50%; background:var(--faint); transition:.3s}
  .status[data-s="connected"] .pip{background:var(--signal); box-shadow:0 0 10px var(--signal); animation:breathe 2.4s ease-in-out infinite}
  .status[data-s="ringing"] .pip{background:var(--hearing); animation:breathe .8s ease-in-out infinite}
  .status[data-s="ended"] .pip{background:var(--faint)}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
  .grow{flex:1}
  /* latency: appears ONLY once we have a real measurement */
  .lat{font-family:var(--font-num); font-size:12px; color:var(--dim); opacity:0; transition:opacity .4s; font-variant-numeric:tabular-nums}
  .lat.show{opacity:1}
  .lat b{color:var(--signal); font-weight:500}

  /* ── HERO: camera fills the screen ── */
  .stage{position:absolute; inset:0; background:#070a0e; overflow:hidden}
  .stage video,.stage canvas{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1)}
  /* gentle recognition glow on the whole frame */
  .stage::after{content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 0 var(--signal); transition:box-shadow .25s; border-radius:0}
  .stage.live::after{box-shadow:inset 0 0 120px rgba(52,229,176,.16)}
  .ph{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--faint)}
  .ph .big{font-size:17px; font-weight:600; color:var(--dim)}
  .ph .sm{font-size:13px}

  /* recognized token — quiet, lower-left, only while recognizing */
  .token{
    position:absolute; left:26px; bottom:170px; z-index:4; display:flex; align-items:center; gap:14px;
    opacity:0; transform:translateY(6px); transition:opacity .2s,transform .2s;
  }
  .token.show{opacity:1; transform:none}
  .token .word{font-size:30px; font-weight:700; color:var(--signal); letter-spacing:-.01em}
  .token .meter{width:64px;height:4px;border-radius:2px;background:rgba(255,255,255,.12); overflow:hidden}
  .token .meter i{display:block;height:100%;width:0;background:var(--signal); transition:width .25s ease-out}

  /* ── caption band: the conversation, layered on the camera ── */
  .captions{
    position:absolute; left:0; right:0; bottom:0; z-index:4; padding:30px 26px 26px;
    background:linear-gradient(rgba(7,10,14,0), rgba(7,10,14,.86) 55%, rgba(7,10,14,.95));
    display:flex; flex-direction:column; gap:12px; min-height:150px; justify-content:flex-end;
  }
  .line{display:flex; gap:14px; align-items:baseline; animation:rise .34s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .line .who{font-size:13px; font-weight:700; letter-spacing:.02em; min-width:58px; padding-top:8px}
  .line .say{font-size:clamp(24px,3vw,46px); font-weight:600; line-height:1.18; letter-spacing:-.015em}
  .line.you .who{color:var(--signal)}
  .line.them .who{color:var(--hearing)}
  .line.prev .say{color:var(--dim)} .line.prev .who{opacity:.55}

  /* ── sign profile: a quiet bottom-right affordance, not a panel ── */
  .profile{position:absolute; right:22px; bottom:172px; z-index:4; display:flex; flex-direction:column; align-items:flex-end; gap:10px; max-width:46vw}
  .vocab{display:flex; flex-wrap:wrap; gap:7px; justify-content:flex-end}
  .pill{font-size:13px; font-weight:500; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--dim); transition:.25s}
  .pill.fresh{background:rgba(52,229,176,.16); color:var(--signal); animation:pop 1s ease-out}
  .pill.flash{color:var(--signal)}
  @keyframes pop{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .teach{font-size:13px; font-weight:600; color:var(--text); background:var(--signal); border:none; cursor:pointer;
    padding:9px 16px; border-radius:999px; transition:.2s}
  .teach:hover{filter:brightness(1.08)}

  /* demo harness — delete for prod */
  .demo{position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:50; display:flex; gap:6px; opacity:.5; transition:.2s}
  .demo:hover{opacity:1}
  .demo button{font:500 12px var(--font); padding:6px 10px; border-radius:8px; cursor:pointer; background:var(--raise); border:1px solid rgba(255,255,255,.08); color:var(--dim)}
  .demo button:hover{color:var(--text)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="logo">Hand<b>set</b></div>
    <div class="status" id="status" data-s="idle"><span class="pip"></span><span id="status-label">Not connected</span></div>
    <div class="grow"></div>
    <div class="lat" id="lat">recognition <b id="lat-val">—</b></div>
  </div>

  <div class="stage" id="stage">
    <div class="ph" id="ph">
      <div class="big">Camera ready</div>
      <div class="sm">Sign to begin — your words are spoken on the call</div>
    </div>
    <!-- video + landmark canvas mount here (recognition layer) -->

    <div class="token" id="token">
      <span class="word" id="token-word">—</span>
      <span class="meter"><i id="token-meter"></i></span>
    </div>

    <div class="profile" id="profile">
      <div class="vocab" id="vocab"></div>
      <button class="teach" id="teach">Teach a sign</button>
    </div>

    <div class="captions" id="captions"></div>
  </div>
</div>

<div class="demo">
  <button onclick="SignalRoom.setCallState('ringing')">ring</button>
  <button onclick="SignalRoom.setCallState('connected')">connect</button>
  <button onclick="demoSign('APPOINTMENT',0.94)">sign</button>
  <button onclick="SignalRoom.onSpoken(\"Hi, I'd like to book an appointment.\")">speak</button>
  <button onclick="SignalRoom.onCaption('aarya','Sure — what day works for you?')">reply</button>
  <button onclick="SignalRoom.onSignLearned('WATER')">learn</button>
  <button onclick="SignalRoom.setCallState('ended')">end</button>
</div>

<script>
const SignalRoom = (() => {
  const $ = id => document.getElementById(id);
  const BASE = ['Hello','Appointment','Thank you','Cancel','Yes','No','Wait','Repeat'];
  const vocab = [...BASE];

  function renderVocab(fresh){
    const v=$('vocab'); v.innerHTML='';
    vocab.forEach(t=>{
      const p=document.createElement('span');
      p.className='pill'+(t===fresh?' fresh':''); p.dataset.t=t.toUpperCase(); p.textContent=t;
      v.appendChild(p);
    });
  }
  function caption(who,text){
    const c=$('captions');
    c.querySelectorAll('.line').forEach(l=>l.classList.add('prev'));
    const el=document.createElement('div');
    el.className='line '+who;
    el.innerHTML='<span class="who"></span><span class="say"></span>';
    el.querySelector('.who').textContent = who==='you'?'You':'Aarya';
    el.querySelector('.say').textContent = text;
    c.appendChild(el);
    while(c.children.length>3) c.removeChild(c.firstChild);
  }

  return {
    onSignRecognized(token, confidence){
      $('stage').classList.add('live');
      $('ph').style.opacity=0;
      const t=$('token'); t.classList.add('show');
      $('token-word').textContent = token;
      $('token-meter').style.width = Math.round(confidence*100)+'%';
      // flash matching pill
      const pill=document.querySelector('.pill[data-t="'+token.toUpperCase()+'"]');
      if(pill){pill.classList.remove('flash');void pill.offsetWidth;pill.classList.add('flash');}
      setTimeout(()=>{$('stage').classList.remove('live'); t.classList.remove('show');},1100);
    },
    onSpoken(text){ caption('you', text); },
    onCaption(speaker, text){ if(speaker==='aarya') caption('them', text); },
    onSignLearned(token){
      const nice = token.charAt(0)+token.slice(1).toLowerCase();
      if(!vocab.find(v=>v.toUpperCase()===token.toUpperCase())) vocab.push(nice);
      renderVocab(nice);
    },
    setCallState(state){
      $('status').dataset.s=state;
      $('status-label').textContent =
        state==='connected'?'On call · Aarya':
        state==='ringing'?'Ringing…':
        state==='ended'?'Call ended':'Not connected';
    },
    /* real measured recognition latency (ms). Only then does the readout appear. */
    setRecognitionLatency(ms){ $('lat').classList.add('show'); $('lat-val').textContent = ms+' ms'; },
    _init(){ renderVocab(); }
  };
})();
SignalRoom._init();
function demoSign(t,c){ SignalRoom.onSignRecognized(t,c); SignalRoom.setRecognitionLatency(218); }
</script>
</body>
</html>
