<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Handset</title>
<!--
  HANDSET — clean signing-first client (v3, INTEGRATED).
  Aarya owns this visual layer. Imports Arav's client/recognizer.js for REAL
  hand tracking + recognition; renders everything from its callbacks.
  Camera-dominant, captions overlay, Figtree. Mono ONLY on the real latency number.
  MUST be served over http:// (localhost) — file:// breaks module imports + WS + camera.
    cd client && python3 -m http.server 5173   → http://localhost:5173/signal-room.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#0B0D11; --raise:#14171F;
    --signal:#34E5B0; --hearing:#F5B23D;
    --text:#F2F5F8; --dim:#9AA3B2; --faint:#5A6372;
    --font:'Figtree',system-ui,-apple-system,sans-serif;
    --font-num:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--base); color:var(--text); font-family:var(--font); overflow:hidden; -webkit-font-smoothing:antialiased}
  .app{position:relative; height:100vh; height:100dvh}

  /* top bar: identity + call status + model badge. nothing fake. */
  .bar{position:absolute; top:0; left:0; right:0; z-index:6; display:flex; align-items:center; gap:14px;
    padding:18px 26px; background:linear-gradient(var(--base),rgba(11,13,17,0))}
  .logo{font-weight:700; font-size:16px; letter-spacing:-.01em}
  .logo b{color:var(--signal)}
  .status{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); font-weight:500}
  .status .pip{width:8px;height:8px;border-radius:50%; background:var(--faint); transition:.3s}
  .status[data-s="connected"] .pip{background:var(--signal); box-shadow:0 0 10px var(--signal); animation:breathe 2.4s ease-in-out infinite}
  .status[data-s="ringing"] .pip{background:var(--hearing); animation:breathe .8s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
  .grow{flex:1}
  /* MODEL BADGE — shows which model the last utterance routed through */
  .badge{display:none; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--text);
    background:var(--raise); border:1px solid rgba(255,255,255,.08); padding:6px 11px; border-radius:999px}
  .badge.show{display:flex}
  .badge .gpu{width:7px;height:7px;border-radius:50%;background:#76b900}  /* NVIDIA green */
  .badge .name{font-family:var(--font-num); font-weight:500; color:var(--dim)}
  /* latency: appears ONLY when a real measured value arrives */
  .lat{display:none; font-family:var(--font-num); font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums}
  .lat.show{display:inline}
  .lat b{color:var(--signal); font-weight:500}

  /* HERO camera — contain (not cover) so the whole upper body + hands are visible,
     not a cropped face close-up. Centered in the stage. */
  .stage{position:absolute; inset:0; background:#070a0e; overflow:hidden; display:flex; align-items:center; justify-content:center}
  .stage video{max-width:100%; max-height:100%; object-fit:contain; transform:scaleX(-1)}
  .stage canvas{position:absolute; pointer-events:none; transform:scaleX(-1)}
  .stage.ready .ph{opacity:0; pointer-events:none}  /* hide placeholder once camera is live */
  .stage::after{content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 0 var(--signal); transition:box-shadow .25s}
  .stage.live::after{box-shadow:inset 0 0 120px rgba(52,229,176,.16)}
  .ph{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--faint)}
  .ph .big{font-size:17px; font-weight:600; color:var(--dim)}
  .ph .sm{font-size:13px}

  .token{position:absolute; left:26px; bottom:172px; z-index:4; display:flex; align-items:center; gap:14px; opacity:0; transform:translateY(6px); transition:.2s}
  .token.show{opacity:1; transform:none}
  .token .word{font-size:30px; font-weight:700; color:var(--signal); letter-spacing:-.01em}
  .token .meter{width:64px;height:4px;border-radius:2px;background:rgba(255,255,255,.12); overflow:hidden}
  .token .meter i{display:block;height:100%;width:0;background:var(--signal); transition:width .2s ease-out}

  /* ambiguous picker (conf 0.55–0.85) */
  .pick{position:absolute; left:26px; bottom:230px; z-index:5; display:none; gap:8px}
  .pick.show{display:flex}
  .pick button{font:600 14px var(--font); padding:8px 14px; border-radius:10px; cursor:pointer;
    background:var(--raise); border:1px solid rgba(52,229,176,.4); color:var(--text)}
  .pick button:hover{background:rgba(52,229,176,.16)}

  /* captions overlay */
  .captions{position:absolute; left:0; right:0; bottom:0; z-index:4; padding:30px 26px 26px;
    background:linear-gradient(rgba(7,10,14,0),rgba(7,10,14,.86) 55%,rgba(7,10,14,.95));
    display:flex; flex-direction:column; gap:12px; min-height:150px; justify-content:flex-end}
  .line{display:flex; gap:14px; align-items:baseline; animation:rise .34s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .line .who{font-size:13px; font-weight:700; letter-spacing:.02em; min-width:58px; padding-top:8px}
  .line .say{font-size:clamp(24px,3vw,46px); font-weight:600; line-height:1.18; letter-spacing:-.015em}
  .line.you .who{color:var(--signal)}  .line.them .who{color:var(--hearing)}
  .line.prev .say{color:var(--dim)}  .line.prev .who{opacity:.55}

  /* sign vocab — quiet bottom-right */
  .profile{position:absolute; right:22px; bottom:172px; z-index:4; display:flex; flex-direction:column; align-items:flex-end; gap:10px; max-width:42vw}
  .vocab{display:flex; flex-wrap:wrap; gap:7px; justify-content:flex-end}
  .pill{font-size:13px; font-weight:500; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--dim); transition:.25s}
  .pill.fresh{background:rgba(52,229,176,.16); color:var(--signal); animation:pop 1s ease-out}
  .pill.flash{color:var(--signal)}
  @keyframes pop{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .teach{font:600 13px var(--font); color:#06231b; background:var(--signal); border:none; cursor:pointer; padding:9px 16px; border-radius:999px}
  .teach:hover{filter:brightness(1.08)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="logo">Hand<b>set</b></div>
    <div class="status" id="status" data-s="idle"><span class="pip"></span><span id="status-label">Not connected</span></div>
    <div class="grow"></div>
    <div class="badge" id="badge"><span class="gpu"></span><span>NVIDIA</span><span class="name" id="badge-name">—</span></div>
    <div class="lat" id="lat">recognition <b id="lat-val">—</b></div>
  </div>

  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="ph" id="ph">
      <div class="big">Camera ready</div>
      <div class="sm">Sign to begin — your words are spoken on the call</div>
    </div>

    <div class="pick" id="pick"></div>
    <div class="token" id="token"><span class="word" id="token-word">—</span><span class="meter"><i id="token-meter"></i></span></div>

    <div class="profile">
      <div class="vocab" id="vocab"></div>
      <button class="teach" id="teach">Teach a sign</button>
    </div>

    <div class="captions" id="captions"></div>
  </div>
</div>

<script type="module">
import { createRecognizer } from './recognizer.js';

const $ = id => document.getElementById(id);

/* ---- pure rendering helpers (the UI's only job) ---- */
function setCallState(state){
  $('status').dataset.s = state;
  $('status-label').textContent =
    state==='connected'?'On call · Aarya': state==='ringing'?'Ringing…':
    state==='ended'?'Call ended':'Not connected';
}
function showModel(modelLabel){           // model badge — which NVIDIA model routed this utterance
  $('badge').classList.add('show');
  $('badge-name').textContent = modelLabel;
}
function sizeCanvasToVideo(){
  // overlay must match the DISPLAYED video rect (contain letterboxes it), so landmarks align
  const c=$('overlay'), v=$('video');
  const r=v.getBoundingClientRect();
  c.style.width=r.width+'px'; c.style.height=r.height+'px';
  c.style.left=r.left+'px'; c.style.top=r.top+'px';
  c.width=r.width; c.height=r.height;
}
function drawLandmarks(lm){
  const c=$('overlay');
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
  if(!lm || !lm.length) return;
  sizeCanvasToVideo();
  ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(52,229,176,.85)'; ctx.lineWidth=3;
  const E=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  for(const [a,b] of E){ ctx.beginPath(); ctx.moveTo(lm[a].x*c.width,lm[a].y*c.height); ctx.lineTo(lm[b].x*c.width,lm[b].y*c.height); ctx.stroke(); }
  for(const p of lm){ ctx.beginPath(); ctx.arc(p.x*c.width,p.y*c.height,4,0,7); ctx.fill(); }
}
function pushCaption(who,text){
  const c=$('captions');
  c.querySelectorAll('.line').forEach(l=>l.classList.add('prev'));
  const el=document.createElement('div'); el.className='line '+who;
  el.innerHTML='<span class="who"></span><span class="say"></span>';
  el.querySelector('.who').textContent = who==='you'?'You':'Aarya';
  el.querySelector('.say').textContent = text;
  c.appendChild(el); while(c.children.length>3) c.removeChild(c.firstChild);
}
function flashToken(token, conf){
  $('ph').style.opacity=0; $('stage').classList.add('live');
  const t=$('token'); t.classList.add('show');
  $('token-word').textContent=token; $('token-meter').style.width=Math.round(conf*100)+'%';
  const pill=document.querySelector('.pill[data-t="'+token.toUpperCase()+'"]');
  if(pill){pill.classList.remove('flash');void pill.offsetWidth;pill.classList.add('flash');}
  setTimeout(()=>{$('stage').classList.remove('live'); t.classList.remove('show');},1100);
}
function showLatency(ms){ $('lat').classList.add('show'); $('lat-val').textContent=ms+' ms'; }
function renderVocab(list, fresh){
  const v=$('vocab'); v.innerHTML='';
  list.forEach(t=>{ const p=document.createElement('span');
    p.className='pill'+(t===fresh?' fresh':''); p.dataset.t=String(t).toUpperCase(); p.textContent=t; v.appendChild(p); });
}
function showPicker(top3){
  const p=$('pick'); p.innerHTML='';
  top3.forEach(label=>{ const b=document.createElement('button'); b.textContent=label;
    b.onclick=()=>{ rec.confirm(label); p.classList.remove('show'); }; p.appendChild(b); });
  p.classList.add('show');
}

/* ---- wire Arav's recognizer into the UI ---- */
const rec = createRecognizer({
  video: $('video'),
  bridgeUrl: 'ws://localhost:8790/signal',  // 8787 is Quorus; Handset bot is on 8790
  on: {
    ready(){ $('stage').classList.add('ready'); sizeCanvasToVideo(); renderVocab(rec.getLexicon ? (rec.getLexicon()||[]) : []); },
    frame(lm){ drawLandmarks(lm); },
    reading(token, conf){ if(conf>0.4){ $('token').classList.add('show'); $('token-word').textContent=token; $('token-meter').style.width=Math.round(conf*100)+'%'; } },
    sign(token, conf, latencyMs){ flashToken(token, conf); if(latencyMs) showLatency(latencyMs); },
    ambiguous(top3){ showPicker(top3); },
    learned(label, count){ const nice=label.charAt(0)+label.slice(1).toLowerCase();
      const list=(rec.getLexicon&&rec.getLexicon())|| []; if(!list.includes(nice)) list.push(nice); renderVocab(list, nice); },
    spoken(text){ pushCaption('you', text); },
    caption(text){ pushCaption('them', text); },
    bridge(connected){ /* connection state only; no fake metric */ },
    error(msg){ console.warn('[recognizer]', msg); },
  },
});

$('teach').onclick = ()=>{ const label=prompt('Name the sign to teach:'); if(label) rec.teachSign(label.toUpperCase()); };

rec.start().catch(e=>{
  $('ph').innerHTML='<div class="big">Camera needs permission</div><div class="sm">'+(e?.message||e)+'</div>';
});

/* expose model-badge + call-state hooks for the bot/bridge to drive */
window.Handset = { setCallState, showModel };
</script>
</body>
</html>
